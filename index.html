<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Us</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Georgia, serif;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at center, #1b233a, #06080f);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  overflow:hidden;
}

/* COVER */
#cover{
  text-align:center;
  cursor:pointer;
}

#cover p{
  opacity:0.8;
  margin-top:10px;
}

/* ALBUM */
.album{
  display:none;
  gap:22px;
  flex-wrap:wrap;
  justify-content:center;
}

/* POLAROID */
.polaroid{
  background:white;
  padding:12px 12px 36px;
  width:220px;              /* much smaller */
  box-shadow:0 16px 34px rgba(0,0,0,0.6);
  animation:fadeIn 1s ease forwards;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* IMAGE */
.polaroid img{
  max-width:100%;
  max-height:250px;         /* smaller image */
  object-fit:contain;
  display:block;
  margin:0 auto;
}

/* CAPTION */
.polaroid p{
  margin-top:12px;
  font-size:13px;
  color:#444;
  text-align:center;
  line-height:1.45;
  padding:0 4px;
}

/* POPUPS */
.popup{
  position:absolute;
  font-size:22px;
  animation:float 2s ease forwards;
}

@keyframes float{
  0%{opacity:0; transform:scale(0.5);}
  20%{opacity:1;}
  100%{opacity:0; transform:translateY(-40px);}
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(12px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div id="cover">
  <div style="font-size:20px;">tap to open 💗</div>
  <p>music & memories</p>
</div>

<div class="album" id="album">

  <div class="polaroid">
    <img src="photo1.jpg">
    <p>
      The kind of picture that doesn’t need a reason —<br>
      just two people standing quietly, already feeling like home.
    </p>
  </div>

  <div class="polaroid">
    <img src="photo2.jpg">
    <p>
      Nothing loud, nothing extra —<br>
      just us, exactly where we belong.
    </p>
  </div>

</div>

<audio id="music" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
const cover = document.getElementById("cover");
const album = document.getElementById("album");
const music = document.getElementById("music");

cover.addEventListener("click", () => {
  cover.style.display = "none";
  album.style.display = "flex";
  music.play();

  setInterval(() => {
    const p = document.createElement("div");
    p.className = "popup";
    p.innerText = Math.random() > 0.5 ? "💗" : "💋";
    p.style.left = Math.random() * window.innerWidth + "px";
    p.style.top = Math.random() * window.innerHeight + "px";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),2000);
  }, 800);
});
</script>

</body>
</html>
