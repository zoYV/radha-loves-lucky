<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Us</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Georgia, serif;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at center, #1b233a, #06080f);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 10px;
  color:white;
  overflow:hidden;
}

/* MUSIC BAR */
audio{
  width:260px;
  margin-bottom:20px;
  opacity:0.9;
}

/* ALBUM */
.album{
  display:flex;
  gap:26px;
  flex-wrap:wrap;
  justify-content:center;
}

/* POLAROID */
.polaroid{
  background:white;
  padding:14px 14px 40px;
  width:280px;
  box-shadow:0 18px 40px rgba(0,0,0,0.6);
  animation:fadeIn 1s ease forwards;
}

.polaroid img{
  width:100%;
  display:block;
}

.polaroid p{
  margin-top:14px;
  font-size:14px;
  color:#444;
  text-align:center;
  line-height:1.5;
}

/* POPUPS */
.popup{
  position:absolute;
  font-size:22px;
  animation:pop 2s ease forwards;
}

@keyframes pop{
  0%{opacity:0; transform:scale(0.5);}
  20%{opacity:1; transform:scale(1);}
  100%{opacity:0; transform:translateY(-40px);}
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(12px);}
  to{opacity:1; transform:translateY(0);}
}

.hint{
  margin-top:16px;
  font-size:13px;
  opacity:0.7;
}
</style>
</head>

<body>

<audio id="music" autoplay muted loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="album">

  <div class="polaroid">
    <img src="photo1.jpg">
    <p>
      The kind of picture that doesn’t need a reason —<br>
      just two people standing quietly, already feeling like home.
    </p>
  </div>

  <div class="polaroid">
    <img src="photo2.jpg">
    <p>
      Nothing loud, nothing extra —<br>
      just us, exactly where we belong.
    </p>
  </div>

</div>

<p class="hint">tap anywhere once 💗</p>

<script>
const music = document.getElementById("music");
let unlocked = false;

// unmute + play on first tap
document.body.addEventListener("click", () => {
  if(!unlocked){
    music.muted = false;
    music.play();
    unlocked = true;
  }
});

// 💗 💋 POPUPS
setInterval(() => {
  const p = document.createElement("div");
  p.className = "popup";
  p.innerText = Math.random() > 0.5 ? "💗" : "💋";
  p.style.left = Math.random() * window.innerWidth + "px";
  p.style.top = Math.random() * window.innerHeight + "px";
  document.body.appendChild(p);

  setTimeout(() => p.remove(), 2000);
}, 800);
</script>

</body>
</html>
