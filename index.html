<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Album</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Georgia, serif;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at center, #1b233a, #06080f);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 10px;
  color:white;
}

/* MUSIC */
audio{
  width:260px;
  margin-bottom:18px;
  opacity:0.85;
}

/* ALBUM */
.album{
  display:flex;
  gap:26px;
  flex-wrap:wrap;
  justify-content:center;
}

/* POLAROID */
.polaroid{
  background:white;
  padding:14px 14px 40px;
  width:280px;
  box-shadow:0 18px 40px rgba(0,0,0,0.6);
  animation:fadeIn 1s ease forwards;
}

.polaroid img{
  width:100%;
  display:block;
}

.polaroid p{
  margin-top:14px;
  font-size:14px;
  color:#444;
  text-align:center;
  line-height:1.5;
}

/* HINT */
.hint{
  margin-top:16px;
  font-size:13px;
  opacity:0.7;
}

/* ANIMATION */
@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>
</head>

<body>

<!-- SONG (no JS, user taps play) -->
<audio controls autoplay muted loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="album">

  <div class="polaroid">
    <img src="photo1.jpg" alt="Memory one">
    <p>
      The kind of picture that doesn’t need a reason —<br>
      just two people standing quietly, already feeling like home.
    </p>
  </div>

  <div class="polaroid">
    <img src="photo2.jpg" alt="Memory two">
    <p>
      Nothing loud, nothing extra —<br>
      just us, exactly where we belong.
    </p>
  </div>

</div>

<p class="hint">tap ▶️ once to hear the song 🤍</p>

</body>
</html>
